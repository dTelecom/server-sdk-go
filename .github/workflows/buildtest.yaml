name: Go SDK tests

on:
  push:
    branches: [dtelecom-db]
  pull_request:
    branches: [dtelecom-db]
  workflow_dispatch:
    inputs:
      live:
        description: Run the two-participant Cloud room test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.23.8', stable]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Build, vet and test the SDK
        run: |
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 ./...
      - name: Test a downstream consumer
        run: scripts/prepare-consumer.sh "$RUNNER_TEMP/consumer"

  live:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.live && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: sdk-live-tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.8'
      - name: Prepare the downstream consumer and audio fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          scripts/prepare-consumer.sh "$RUNNER_TEMP/consumer"
      - name: Exercise the two-party call and room administration
        env:
          DTELECOM_CLOUD_URL: ${{ secrets.DTELECOM_CLOUD_URL }}
          DTELECOM_API_KEY: ${{ secrets.DTELECOM_API_KEY }}
          DTELECOM_API_SECRET: ${{ secrets.DTELECOM_API_SECRET }}
        run: |
          : "${DTELECOM_CLOUD_URL:?Missing test Cloud URL}" "${DTELECOM_API_KEY:?Missing test API key}" "${DTELECOM_API_SECRET:?Missing test API secret}"
          command -v ffmpeg > /dev/null
          cd "$RUNNER_TEMP/consumer"
          export DTELECOM_ROOM_MANAGEMENT_BIN="$PWD/room-management"
          # Underlying transports may include credentials in error responses. Keep raw logs private.
          umask 077
          trap 'rm -f live.log' EXIT
          if ! ./live-room.test -test.v -test.run '^TestLiveRoomsAndBot$' -test.timeout 3m > live.log 2>&1 ||
             ! grep -q '^--- PASS: TestLiveRoomsAndBot ' live.log; then
            awk 'match($0, /(consumer|integration)_test\.go:[0-9]+/) { print substr($0, RSTART, RLENGTH) }' live.log
            echo 'Cloud room test failed.'
            exit 1
          fi
          echo 'Two participants joined, exchanged data and exercised the room-management example and administration.'
